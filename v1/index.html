
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Luxury Rickshaw- Playlist</title>
<meta name="description" content="A cinematic, illustrated Indian-street-inspired YouTube playlist player." />

<!-- Fonts: Yatra One (Devanagari display), Noto Serif Devanagari (fallback for hero),
     Manrope (UI sans). All have full system-font fallbacks defined in style.css,
     so the page still looks correct if fonts.googleapis.com is unreachable. -->
<link rel="manifest" href="site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Serif+Devanagari:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="apple-touch-icon" sizes="57x57" href="assets/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="60x60" href="assets/favicon//apple-icon-60x60.png">
<link rel="apple-touch-icon" sizes="72x72" href="assets/favicon//apple-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="assets/favicon//apple-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="assets/favicon//apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="assets/favicon//apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="assets/favicon//apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/favicon//apple-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon//apple-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192"  href="/android-icon-192x192.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon//favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon//favicon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/">
<link rel="manifest" href="/manifest.json">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">



<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================================
       BACKGROUND LAYER
       Order (back to front): illustrated scene -> dynamic thumbnail
       wash -> color overlay -> grain texture
  ============================================================= -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-illustration" id="bgIllustration">
      <!-- Built-in illustrated dusk skyline, used when no CONFIG.backgroundImage
           is supplied. See generateIllustration() in script.js for the sky/sun,
           and the static markup below for the string lights + birds. -->
      <svg class="skyline-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5c1f1a" />
            <stop offset="45%" stop-color="#9c3a26" />
            <stop offset="75%" stop-color="#c9622f" />
            <stop offset="100%" stop-color="#e39a4a" />
          </linearGradient>
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe9c2" stop-opacity="0.95" />
            <stop offset="45%" stop-color="#f3b25a" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#f3b25a" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="rowFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a1512" />
            <stop offset="100%" stop-color="#2b0f0d" />
          </linearGradient>
          <linearGradient id="rowMid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#26100d" />
            <stop offset="100%" stop-color="#1c0b09" />
          </linearGradient>
          <linearGradient id="rowNear" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#160908" />
            <stop offset="100%" stop-color="#0f0605" />
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="1600" height="900" fill="url(#skyGrad)" />
        <circle cx="800" cy="430" r="320" fill="url(#sunGlow)" />
        <circle cx="800" cy="430" r="120" fill="#ffedd0" opacity="0.9" />

        <!-- birds -->
        <g class="birds" stroke="#2b0f0d" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55">
          <path d="M300 220 q14 -16 28 0 q14 -16 28 0" />
          <path d="M370 260 q10 -12 20 0 q10 -12 20 0" />
          <path d="M1180 200 q12 -14 24 0 q12 -14 24 0" />
        </g>

        <!-- far skyline -->
        <g id="rowFarBuildings" fill="url(#rowFar)"></g>
        <!-- mid skyline -->
        <g id="rowMidBuildings" fill="url(#rowMid)"></g>
        <!-- near skyline / foreground silhouette -->
        <g id="rowNearBuildings" fill="url(#rowNear)"></g>

        <!-- hanging string lights -->
        <g class="string-lights" fill="none" stroke="#3a1512" stroke-width="3" opacity="0.8">
          <path d="M0 90 Q 400 210 800 100 T 1600 95" />
        </g>
        <g class="string-bulbs" fill="#ffd98a"></g>
      </svg>
    </div>

    <div class="bg-photo" id="bgPhoto"></div>
    <div class="bg-photo bg-photo--dynamic" id="bgPhotoDynamic"></div>
    <div class="bg-photo bg-photo--mobile" id="bgPhotoMobile"></div>
    <div class="bg-overlay"></div>
    <div class="bg-grain"></div>
  </div>

  <!-- ============================================================
       TOP-LEFT: LOCAL CLOCK
  ============================================================= -->
  <div class="clock" id="clock" aria-hidden="true"></div>

  <!-- ============================================================
       TOP-RIGHT: SERVICE NAVIGATION
  ============================================================= -->
  <nav class="service-nav" aria-label="Listening options">
    <a href="/v2/index.html" class="service-link" aria-label="Open Rickshaw v2">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
      <span> V2</span>
    </a>

    <span class="online-pill" id="onlinePill">
      <span class="online-dot" aria-hidden="true"></span>
      <span><span id="onlineCount">30</span> online</span>
    </span>
    <a class="service-link" id="spotifyLink" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open on Spotify (new tab)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.14 14.36a.62.62 0 0 1-.86.2c-2.36-1.44-5.34-1.77-8.84-.97a.62.62 0 1 1-.27-1.21c3.83-.87 7.12-.5 9.76 1.11.3.19.4.58.21.87Zm1.15-2.6a.78.78 0 0 1-1.07.25c-2.7-1.66-6.82-2.14-10.02-1.17a.78.78 0 0 1-.45-1.49c3.65-1.1 8.19-.57 11.29 1.33.37.22.49.71.25 1.08Zm.1-2.7C14.6 9.2 9.4 9.02 6.36 9.96a.93.93 0 1 1-.55-1.78c3.5-1.06 9.25-.86 12.9 1.32a.93.93 0 0 1-.97 1.58Z" fill="currentColor"/></svg>
      <span>Spotify</span>
      <span class="ext-arrow" aria-hidden="true">↗</span>
    </a>
    <a class="service-link" id="ytMusicLink" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open on YT Music (new tab)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><circle cx="12" cy="12" r="6.2" fill="#1c0b09"/><path d="M10.3 9.3v5.4l4.6-2.7-4.6-2.7Z" fill="currentColor"/></svg>
      <span>YT Music</span>
      <span class="ext-arrow" aria-hidden="true">↗</span>
    </a>
  </nav>

  <!-- ============================================================
       CENTRAL HERO TITLE (part of the artwork, not a heading)
  ============================================================= -->
  <div class="hero-title" id="heroTitle" aria-hidden="true"></div>

  <!-- ============================================================
       STATUS / LOADING / ERROR BANNER
  ============================================================= -->
  <div class="status-banner" id="statusBanner" role="status" aria-live="polite"></div>

  <!-- ============================================================
       YOUTUBE PLAYER — functional, visually hidden
  ============================================================= -->
  <div class="yt-hidden" aria-hidden="true">
    <div id="youtube-player"></div>
  </div>

  <!-- ============================================================
       FLOATING MUSIC PLAYER
  ============================================================= -->
  <section class="player" id="player" aria-label="Music player">
    <div class="player-art-ring" id="artRing">
      <img class="player-art" id="albumArt" src="" alt="" />
    </div>

    <div class="player-body">
      <div class="track-meta">
        <p class="track-title" id="trackTitle">Loading playlist…</p>
        <p class="track-artist" id="trackArtist">Please wait</p>
      </div>

      <div class="progress-row">
        <span class="time-label" id="currentTime">0:00</span>
        <div
          class="progress-track"
          id="progressTrack"
          role="slider"
          tabindex="0"
          aria-label="Seek"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-handle" id="progressHandle"></div>
          <div class="scrub-tooltip" id="scrubTooltip">0:00</div>
        </div>
        <span class="time-label" id="durationTime">0:00</span>
      </div>
    </div>

    <div class="player-controls">
  <button class="ctrl-btn repeat-btn" id="repeatBtn" aria-label="Repeat off" title="Repeat" aria-pressed="false">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7Zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4Z"/></svg>
</button>

      <button class="ctrl-btn seek-btn" id="seekBackBtn" aria-label="Seek back 5 seconds" title="Back 5s">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
  <span class="seek-label">5</span>
      </button>

      <button class="ctrl-btn" id="prevBtn" aria-label="Previous track" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6V6Zm3.5 6 10-6v12l-10-6Z"/></svg>
      </button>

      <button class="play-btn" id="playBtn" aria-label="Play" title="Play">
        <svg id="iconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l12-7L8 5Z"/></svg>
        <svg id="iconPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>
      </button>

      <button class="ctrl-btn" id="nextBtn" aria-label="Next track" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2V6Zm-2 6-10 6V6l10 6Z"/></svg>
      </button>

      <button class="ctrl-btn seek-btn" id="seekForwardBtn" aria-label="Seek forward 5 seconds" title="Forward 5s">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="transform: scaleX(-1)"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
  <span class="seek-label">5</span>
</button>




<div class="volume-wrap">
        <button class="ctrl-btn volume-btn" id="volumeBtn" aria-label="Mute" title="Mute">
          <svg id="iconVolume" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4Zm11.5 3a3.5 3.5 0 0 0-2-3.16v6.32A3.5 3.5 0 0 0 15.5 12Z"/></svg>
          <svg id="iconMuted" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M4 9v6h4l5 5V4L8 9H4Zm12.7-1.3-1.4 1.4 2 1.9-2 1.9 1.4 1.4 1.9-2 1.9 2 1.4-1.4-2-1.9 2-1.9-1.4-1.4-1.9 2-1.9-2Z"/></svg>
        </button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="80" aria-label="Volume" />
      </div>

      <button class="ctrl-btn queue-btn" id="queueBtn" aria-label="Show queue" title="Queue" aria-expanded="false" aria-controls="queuePanel">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6h11v2H4V6Zm0 5h11v2H4v-2Zm0 5h7v2H4v-2Zm13.5-8L22 12l-4.5 4V8Z"/></svg>
      </button>
    </div>
  </section>

  <!-- ============================================================
       QUEUE DRAWER — swipeable "up next" panel
  ============================================================= -->
  <div class="queue-backdrop" id="queueBackdrop"></div>
  <section class="queue-panel" id="queuePanel" aria-label="Song queue" aria-hidden="true">
    <div class="queue-handle" id="queueHandle" aria-hidden="true"></div>
    <div class="queue-header">
      <h2 class="queue-title">Up next</h2>
      <button class="queue-close" id="queueCloseBtn" aria-label="Close queue">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4 6.4 5Zm12.6 1.4L6.4 19 5 17.6 17.6 5 19 6.4Z"/></svg>
      </button>
    </div>
    <ul class="queue-list" id="queueList" role="list"></ul>
  </section>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
